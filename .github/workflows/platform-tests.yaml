name: Platform tests

on:
    workflow_call:
        inputs:
            # Deprecated, use `test-files-glob`
            subtest:
                type: string
                default: ""
                required: false
            # Specify what tests you want to run, relative to `test/platform`
            test-files-glob:
                type: string
                default: ""
                required: false
            working-directory:
                type: string
                default: .
                required: false
            additional-working-directory:
                type: string
                required: false
            # Defaults to #notif-<repo-name> when empty, matching the previous behavior.
            report-slack-channel:
                type: string
                default: ""
                required: false

# Secrets are read by name straight from the `secrets` context (populated by `secrets: inherit`
# in the caller) and attached to the single step that needs them. This job never builds Actors,
# so it never needs the APIFY_TOKEN_* Actor tokens at all.
jobs:
    scheduledPlatformTests:
        name: Scheduled Platform tests
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ inputs.working-directory }}
        steps:
            - name: Setup repository and dependencies
            # For testing, you have to temporarily change the branch
              uses: apify-store/github-actions-source/.github/actions/checkout-restore-dependencies@master
              with:
                  working-directory: ${{ inputs.working-directory }}
                  additional-working-directory: ${{ inputs.additional-working-directory }}
                  npm-token: ${{ secrets.NPM_TOKEN }}

            # `continue-on-error` lets the report step run on failure while still recording the
            # real outcome, which the last step turns back into a job failure.
            - name: Test
              id: test
              continue-on-error: true
              env:
                  TESTER_APIFY_TOKEN: ${{ secrets.TESTER_APIFY_TOKEN }}
              run: |
                  npx vitest ./test/platform/${{ inputs.test-files-glob || inputs.subtest }} \
                    --run \
                    --reporter=default \
                    --reporter=json \
                    --outputFile=./test-output.json \
                    --maxConcurrency 20 \
                    --fileParallelism=true \
                    --maxWorkers 100

            - name: Report test results
              if: always()
              env:
                  SLACK_TOKEN_TESTS_BOT: ${{ secrets.SLACK_TOKEN_TESTS_BOT }}
              run: |
                  if [ ! -f ./test-output.json ]; then
                    echo "No ./test-output.json produced, vitest failed before writing a report. Skipping."
                    exit 0
                  fi
                  npx apify-test-tools report-tests \
                    --report-file ./test-output.json \
                    --workspace . \
                    --workflow-name "${{ github.workflow }}" \
                    --job-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                    --report-slack-channel "${{ inputs.report-slack-channel || format('#notif-{0}', github.event.repository.name) }}"

            - name: Upload Vitest JSON artifact
              uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: vitest-results
                  path: ./test-output.json

            - name: Fail if tests failed
              if: steps.test.outcome == 'failure'
              run: exit 1
