name: Build latest and report to slack

on:
    workflow_call:
        inputs:
            working-directory:
                type: string
                default: .
                required: false
            additional-working-directory:
                type: string
                required: false
            # Defaults to #notif-<repo-name> when empty, matching the previous behavior.
            report-slack-channel:
                type: string
                default: ""
                required: false

jobs:
    pushBuildLatest:
        name: 'Build latest: ${{github.repository}} ${{github.event.head_commit.message}}'
        if: |
          !contains(github.event.head_commit.message, '[skip ci]') &&
          !contains(github.event.head_commit.message, '[skip platform-test]')

        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ inputs.working-directory }}

        steps:
            - name: Setup repository and dependencies
            # For testing, you have to temporarily change the branch
              uses: apify-store/github-actions-source/.github/actions/checkout-restore-dependencies@master
              with:
                  working-directory: ${{ inputs.working-directory }}
                  additional-working-directory: ${{ inputs.additional-working-directory }}
                  npm-token: ${{ secrets.NPM_TOKEN }}

            # Runs after the setup action on purpose: `npm ci` and its postinstall scripts execute
            # there, before any Actor token exists in the environment.
            - name: Export Apify Actor tokens
              uses: apify-store/github-actions-source/.github/actions/export-apify-tokens@master
              with:
                  secrets: ${{ toJSON(secrets) }}

            - name: Release Actors and notify
              env:
                  SLACK_TOKEN_RELEASES_BOT: ${{ secrets.SLACK_TOKEN_RELEASES_BOT }}
              run: |
                  npx apify-test-tools release --push-event-path ${{ github.event_path }} --release-slack-channel "#delivery-public-actors" --report-slack-channel "${{ inputs.report-slack-channel || format('#notif-{0}', github.event.repository.name) }}" --use-docker-cache

            - name: Delete old builds
              run: npx apify-test-tools delete-old-builds
