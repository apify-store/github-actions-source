name: Claude Code

on:
    workflow_call:
        secrets:
            ANTHROPIC_API_KEY:
                required: true
                description: Claude API key
            GITHUB_TOKEN:
                required: true
                description: GitHub token

jobs:
    claude:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write
            actions: read
        if: |
            (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
            (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude' && !contains(github.event.issue.labels.*.name, 'claude:done')) ||
            (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                fetch-depth: 1

            - name: Run Claude Code
              id: claude
              uses: anthropics/claude-code-action@v1
              with:
                anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                track_progress: true
                use_commit_signing: true
                claude_args: |
                    --model claude-sonnet-4-6
                    --allowedTools "Bash(gh pr create*),Bash(gh api*)"

            - name: Mark issue as processed by Claude
              if: |
                github.event_name == 'issues' &&
                github.event.action == 'labeled' &&
                github.event.label.name == 'claude' &&
                steps.claude.conclusion == 'success'
              uses: actions/github-script@v7
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
                script: |
                    try {
                        await github.rest.issues.addLabels({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            issue_number: context.issue.number,
                            labels: ['claude:done']
                        });
                        console.log('Label claude:done added to issue.');
                    } catch (e) {
                        console.log('Label claude:done does not exist. Skipping.');
                    }
