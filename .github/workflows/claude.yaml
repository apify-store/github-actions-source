name: Claude Code

on:
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]
    issues:
        types: [opened, assigned, labeled]
    pull_request_review:
        types: [submitted]
    # workflow_call:
    #     inputs:
    #         ZENHUB_WORKSPACE_ID:
    #             type: string
    #             required: true
    #             description: Zenhub workspace ID
    #     secrets:
    #         ANTHROPIC_API_KEY:
    #             required: true
    #             description: Claude API key
    #         ZENHUB_TOKEN:
    #             required: true
    #             description: Zenhub token
    #         GITHUB_TOKEN:
    #             required: true
    #             description: GitHub token

jobs:
    claude:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write
            actions: read
        if: |
            (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
            (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude' && !contains(github.event.issue.labels.*.name, 'claude:done')) ||
            (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                fetch-depth: 1

            - name: Run Claude Code
              id: claude
              uses: anthropics/claude-code-action@v1
              with:
                anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                track_progress: true

            - name: Move issue to ZenHub QA pipeline
              if: |
                github.event_name == 'issues' &&
                github.event.action == 'labeled' &&
                github.event.label.name == 'claude' &&
                steps.claude.conclusion == 'success' &&
                'meme' == 'lala'
              env:
                # ZENHUB_TOKEN: ${{ secrets.ZENHUB_TOKEN }}
                # ZENHUB_WORKSPACE_ID: ${{ inputs.ZENHUB_WORKSPACE_ID }}
                REPO_GH_ID: ${{ github.event.repository.id }}
                ISSUE_NUMBER: ${{ github.event.issue.number }}
              run: |
                    set +e
                    GQL="https://api.zenhub.com/public/graphql"

                    zenhub_query() {
                        curl -s -X POST "$GQL" \
                        -H "Authorization: Bearer $ZENHUB_TOKEN" \
                        -H "Content-Type: application/json" \
                        -d "$1"
                    }

                    # Step 1: Get pipelines for workspace (using ZENHUB_WORKSPACE_ID directly)
                    WORKSPACE_ID="$ZENHUB_WORKSPACE_ID"
                    if [ -z "$WORKSPACE_ID" ]; then
                        echo "ERROR: ZENHUB_WORKSPACE_ID secret is not set."
                        exit 1
                    fi
                    PIPELINE_DATA=$(zenhub_query "{\"query\": \"query(\$wsId: ID!) { workspace(id: \$wsId) { pipelinesConnection(first: 50) { nodes { id name } } } }\", \"variables\": {\"wsId\": \"$WORKSPACE_ID\"}}")

                    PIPELINE_ID=$(echo "$PIPELINE_DATA" | jq -r '.data.workspace.pipelinesConnection.nodes[] | select(.name == "Review/QA") | .id' 2>/dev/null)

                    if [ -z "$PIPELINE_ID" ]; then
                        echo "Available pipelines:"
                        echo "$PIPELINE_DATA" | jq -r '.data.workspace.pipelinesConnection.nodes[]? | "  \(.name) → \(.id)"' 2>/dev/null
                        echo "ERROR: Pipeline 'Review/QA' not found or workspace query failed."
                        exit 1
                    fi
                    # Step 2: Get ZenHub issue ID
                    ISSUE_DATA=$(zenhub_query "{\"query\": \"query(\$repoGhId: Int!, \$issueNumber: Int!) { issueByInfo(repositoryGhId: \$repoGhId, issueNumber: \$issueNumber) { id } }\", \"variables\": {\"repoGhId\": $REPO_GH_ID, \"issueNumber\": $ISSUE_NUMBER}}")

                    ISSUE_ID=$(echo "$ISSUE_DATA" | jq -r '.data.issueByInfo.id' 2>/dev/null)
                    if [ -z "$ISSUE_ID" ] || [ "$ISSUE_ID" = "null" ]; then
                        echo "ERROR: Could not get ZenHub issue ID."
                        exit 1
                    fi
                    # Step 3: Move issue to Review/QA
                    MOVE_RESULT=$(zenhub_query "{\"query\": \"mutation(\$input: MoveIssueInput!) { moveIssue(input: \$input) { issue { id } } }\", \"variables\": {\"input\": {\"issueId\": \"$ISSUE_ID\", \"pipelineId\": \"$PIPELINE_ID\", \"position\": 0}}}")

                    if echo "$MOVE_RESULT" | jq -e '.errors' >/dev/null 2>&1; then
                        echo "ERROR: Move mutation failed."
                        exit 1
                    fi

                    echo "Issue #$ISSUE_NUMBER moved to Review/QA."

            - name: Mark issue as processed by Claude
              if: |
                github.event_name == 'issues' &&
                github.event.action == 'labeled' &&
                github.event.label.name == 'claude' &&
                steps.claude.conclusion == 'success'
              uses: actions/github-script@v7
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
                script: |
                    // Create label if it doesn't exist yet
                    try {
                    await github.rest.issues.createLabel({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        name: 'claude:done',
                        color: '7057ff',
                        description: 'Already processed by Claude'
                    });
                    } catch (e) {
                    // Label already exists, ignore
                    }

                    await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    labels: ['claude:done']
                    });

                    console.log('Label claude:done added to issue.');